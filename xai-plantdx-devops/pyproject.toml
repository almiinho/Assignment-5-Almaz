[project]
name = "xai-plantdx-devops"
version = "1.1.0"
description = "Reproducible dataset audit utility for XAI-PlantDx"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
plant-dataset-audit = "plant_research.audit:main"
[tool.setuptools.packages.find]
where = ["src"]
